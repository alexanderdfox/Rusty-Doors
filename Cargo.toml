[package]
name = "doors"
version = "0.3.0"
edition = "2021"
description = "Solaris/illumos Doors IPC + binary-reciprocal key/lock"
license = "MIT"

[dependencies]
anyhow = "1"
bytes = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
rand = "0.8"
hex = "0.4"
sha2 = "0.10"
num-bigint = "0.4"
num-traits = "0.2"
num-integer = "0.1"